# Supabase CLI settings for this project (used by `supabase link` and `supabase functions deploy`).
project_id = "almukarramah"

# Webhooks and scheduled jobs check their own secrets, so Supabase's JWT check is turned off for them.
[functions.moyasar-webhook]
verify_jwt = false

[functions.revenuecat-webhook]
verify_jwt = false

[functions.zatca-report]
verify_jwt = false

[functions.charge-subscriptions]
verify_jwt = false

# The shop assistant is used by guests too; it applies its own per-visitor and store-wide daily limits.
[functions.concierge]
verify_jwt = false

# Returns Moyasar form settings for an unpaid subscription order (opened in a browser from the apps, no sign-in there).
[functions.payment-form]
verify_jwt = false
