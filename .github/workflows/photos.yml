# Studio product photos: on a push to a photos/* branch, remove the background from the photos listed in
# scripts/photo-batch.txt, place them on the studio backgrounds, and commit the results to photo-out/ on that branch.
name: Studio product photos
on:
  push:
    branches: ['photos/**']
permissions:
  contents: write
concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  photos:
    if: "!contains(github.event.head_commit.message, '[photos-result]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install "rembg[cpu]==2.0.67" pillow numpy
      - name: Make photos
        run: |
          rm -rf photo-out
          python scripts/product_photos.py --out photo-out --looks "${PHOTO_LOOKS:-ivory,night}" --compare --list scripts/photo-batch.txt
        env:
          PHOTO_LOOKS: ${{ vars.PHOTO_LOOKS }}
      - name: Commit results
        run: |
          git config user.name "photos-bot"
          git config user.email "photos-bot@users.noreply.github.com"
          git add -f photo-out
          git commit -m "Studio photos for ${GITHUB_SHA::7} [photos-result]" || exit 0
          git push
