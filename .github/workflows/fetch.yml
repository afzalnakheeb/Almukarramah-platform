name: fetch-ai-media
on:
  push:
    branches: ['studio/inputs']
    paths: ['ai/urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download each "name url" line into ai/out/
        run: |
          mkdir -p ai/out
          while read -r name url; do
            [ -z "$name" ] && continue
            [ -f "ai/out/$name" ] && continue
            [ -f "ai/out/$name.enc" ] && continue
            mkdir -p "$(dirname "ai/out/$name")"; curl -fsSL --retry 3 -o "ai/out/$name" "$url" && echo "got $name"
            # Private media: encrypt for the studio's key (ai/fetch-pub.pem) so this public branch never holds the plain file.
            if [[ "$name" == private/* ]] && [ -f "ai/out/$name" ]; then
              k=$(openssl rand -hex 32); iv=$(openssl rand -hex 16)
              openssl enc -aes-256-cbc -K "$k" -iv "$iv" -in "ai/out/$name" -out "ai/out/$name.enc"
              printf '%s %s' "$k" "$iv" | openssl pkeyutl -encrypt -pubin -inkey ai/fetch-pub.pem -pkeyopt rsa_padding_mode:oaep -out "ai/out/$name.key"
              rm -f "ai/out/$name"
            fi
          done < ai/urls.txt
      - name: Commit
        run: |
          git config user.name "studio-bot"; git config user.email "studio-bot@users.noreply.github.com"
          git add -A ai/out
          git diff --cached --quiet || git commit -m "AI media [fetch-result]"
          git push
