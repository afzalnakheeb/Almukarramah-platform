name: fetch-ai-media
on:
  push:
    branches: ['studio/inputs']
    paths: ['ai/urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download each "name url" line into ai/out/
        run: |
          mkdir -p ai/out
          while read -r name url; do
            [ -z "$name" ] && continue
            [ -f "ai/out/$name" ] && continue
            curl -fsSL --retry 3 -o "ai/out/$name" "$url" && echo "got $name"
          done < ai/urls.txt
      - name: Commit
        run: |
          git config user.name "studio-bot"; git config user.email "studio-bot@users.noreply.github.com"
          git add -A ai/out
          git diff --cached --quiet || git commit -m "AI media [fetch-result]"
          git push
