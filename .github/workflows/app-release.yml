# Store builds of the iPhone and Android apps on Expo's build servers (EAS), started by hand only:
# GitHub > Actions > "App release (store builds)" > Run workflow.
# Needs the EXPO_TOKEN repository secret (Afzal adds it: docs/app-stores.md). The App Store Connect API key, the Google
# Play service account and the signing keys live in Expo's credential store, never in this repository.
name: App release (store builds)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which apps to build
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: Also send the new builds to App Store Connect (TestFlight) and Google Play (internal testing, draft)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: app-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret first (GitHub > Settings > Secrets and variables > Actions). See docs/app-stores.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install (versions aligned to the Expo SDK; EAS builds from this package.json)
        run: npm run vercel-install
      - name: Expo doctor (report only)
        continue-on-error: true
        run: npx --yes expo-doctor
      - name: Build (production profile, waits for EAS)
        run: eas build --platform ${{ inputs.platform }} --profile production --non-interactive
      - name: Submit to the stores
        if: ${{ inputs.submit }}
        run: eas submit --platform ${{ inputs.platform }} --profile production --latest --non-interactive
