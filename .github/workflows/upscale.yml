name: upscale
on:
  push:
    branches: ['studio/inputs']
    paths: ['ai/upscale.txt']
permissions:
  contents: write
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install and upscale (log kept in ai/up/log.txt)
        run: |
          mkdir -p ai/up weights
          {
          set -x
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install spandrel opencv-python-headless numpy
          curl -fsSL -o weights/general.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          curl -fsSL -o weights/x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          while read -r inp model dn; do
            [ -z "$inp" ] && continue
            python ai/up.py "$inp" "weights/$model.pth" "ai/up/$(basename ${inp%.*})-$model.png" "$dn"
          done < ai/upscale.txt
          } > ai/up/log.txt 2>&1 || true
          tail -30 ai/up/log.txt
      - name: Commit
        run: |
          git config user.name "studio-bot"; git config user.email "studio-bot@users.noreply.github.com"
          git add -A ai/up; git diff --cached --quiet || git commit -m "Upscaled [fetch-result]"; git push
